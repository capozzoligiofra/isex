# Next.js su Netlify: l'adapter @netlify/plugin-nextjs trasforma pagine
# dinamiche, Server Actions e proxy in Netlify Functions. Va dichiarato qui
# perché i deploy caricati via CLI/API non lo aggiungono da soli.
# Le variabili NEXT_PUBLIC_SUPABASE_* vanno impostate nella UI di Netlify:
# vengono incluse al momento della build, quindi dopo averle cambiate serve
# un nuovo deploy.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
